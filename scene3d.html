<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Preview — Volleyball Rotation Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 16px 24px;
      background: rgba(27, 39, 51, 0.75);
      box-sizing: border-box;
    }
    #scene3d {
      position: fixed;
      inset: 0;
    }
    .floating-panel {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 15;
      width: 260px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: var(--panel-bg);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .floating-panel-handle {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: move;
      touch-action: none;
      user-select: none;
      padding: 10px 14px;
      font-weight: bold;
      color: var(--accent);
      background: #e4e9ef;
      border-radius: 8px 8px 0 0;
    }
    .floating-panel-collapse-btn {
      flex: 0 0 auto;
      background: transparent;
      color: var(--accent);
      padding: 4px 12px;
      font-size: 1.4rem;
      line-height: 1;
      transition: transform 0.15s ease;
    }
    .floating-panel-collapse-btn:hover {
      background: rgba(44, 62, 80, 0.15);
    }
    .floating-panel.collapsed .floating-panel-collapse-btn {
      transform: rotate(-90deg);
    }
    .floating-panel.collapsed .floating-panel-body {
      display: none;
    }
    .floating-panel-body {
      padding: 16px;
    }
    .view-cube-wrap {
      position: fixed;
      top: 90px;
      right: 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      /* Medium-size defaults (setup.html's "3D Preview - View Cube Size"
         setting) - js/scene3d.js overrides these at load based on the
         saved size, everything else derives from them via var()/calc(). */
      --vc-scene-size: 150px;
      --vc-perspective: 750px;
      --vc-half: 45px;
      --vc-face-size: 90px;
      --vc-face-font-size: 0.75rem;
      --vc-edge-half: 10px;
      --vc-edge-size: 20px;
      --vc-corner-half: 8px;
      --vc-corner-size: 16px;
    }
    .view-cube-home {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      padding: 0;
      font-size: 1.1rem;
      line-height: 1;
      border-radius: 50%;
    }
    .view-cube-scene {
      position: relative;
      width: var(--vc-scene-size);
      height: var(--vc-scene-size);
      perspective: var(--vc-perspective);
    }
    .view-cube {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }
    .vc-face {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--vc-face-size);
      height: var(--vc-face-size);
      margin: calc(var(--vc-face-size) / -2) 0 0 calc(var(--vc-face-size) / -2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      backface-visibility: hidden;
      box-sizing: border-box;
      background: rgba(44, 62, 80, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      font-size: var(--vc-face-font-size);
      font-weight: bold;
      letter-spacing: 0.03em;
    }
    .vc-face:hover {
      background: rgba(52, 152, 219, 0.85);
    }
    /* Edge/corner hotspots are tiny 3D boxes (built from real cube faces,
       same recipe as .vc-face just smaller), not flat 2D squares - a flat
       hotspot rotates edge-on and nearly disappears when the cube is
       viewed close to face-on from that side. */
    .vc-hotspot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }
    .vc-hotspot-face {
      position: absolute;
      left: 0;
      top: 0;
      cursor: pointer;
      user-select: none;
      backface-visibility: hidden;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(27, 39, 51, 0.6);
    }
    .vc-hotspot.vc-edge .vc-hotspot-face {
      width: var(--vc-edge-size);
      height: var(--vc-edge-size);
      margin: calc(var(--vc-edge-size) / -2) 0 0 calc(var(--vc-edge-size) / -2);
    }
    .vc-hotspot.vc-corner .vc-hotspot-face {
      width: var(--vc-corner-size);
      height: var(--vc-corner-size);
      margin: calc(var(--vc-corner-size) / -2) 0 0 calc(var(--vc-corner-size) / -2);
    }
    .vc-hotspot:hover .vc-hotspot-face {
      background: rgba(52, 152, 219, 0.9);
    }
    .view-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 6px;
      background: var(--panel-bg);
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      min-width: 150px;
    }
    .view-menu button {
      display: block;
      width: 100%;
      border-radius: 0;
      text-align: left;
    }
    .view-menu[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>3D Preview <small style="font-weight: normal; opacity: 0.8;">(work in progress)</small></h1>
    <div class="header-links">
      <a href="index.html" class="setup-link">&larr; Back to Visualizer</a>
    </div>
  </div>
  <div id="scene3d"></div>
  <div id="viewCubeWrap" class="view-cube-wrap">
    <button type="button" id="viewCubeHome" class="view-cube-home" title="Reset to default view (Home / P)">&#8962;</button>
    <div class="view-cube-scene">
      <div id="viewCube3D" class="view-cube"></div>
      <div id="viewMenu3D" class="view-menu" hidden>
        <button type="button" data-view="0,1,0">Top</button>
        <button type="button" data-view="0,-1,0">Bottom</button>
        <button type="button" data-view="0,0,1">Endline</button>
        <button type="button" data-view="0,0,-1">Net</button>
        <button type="button" data-view="-1,0,0">Left</button>
        <button type="button" data-view="1,0,0">Right</button>
        <button type="button" data-view="home">Home / Perspective</button>
      </div>
    </div>
  </div>
  <div id="controlPanel3D" class="floating-panel">
    <div class="floating-panel-handle">
      <span>&#10021; Controls (drag to move)</span>
      <button type="button" id="panelCollapseToggle3D" class="floating-panel-collapse-btn" title="Collapse/expand this panel">&#9662;</button>
    </div>
    <div class="floating-panel-body">
      <div class="panel-section">
        <div class="rotation-display">Serving: <span id="serverZone3D">S</span> (zone 1) &middot; <span id="rotationNumber3D">R1</span></div>
      </div>

      <div class="panel-section">
        <h2>Overlap Status</h2>
        <div class="button-row">
          <button id="overlapGuideToggle3D" class="full-width">Show Overlap Guides</button>
          <button id="playerLinkToggle3D" class="full-width">Show Player Links</button>
        </div>
        <button id="clampToggle3D" class="full-width" title="Constrain dragging so a player can't be moved past the fault line against its current row/column neighbors">Lock to Legal Positions</button>
        <button id="orbitAboutSelection3D" class="full-width" title="When on, the camera orbits/zooms around whichever puck is currently selected instead of the court center">Orbit Around Selection</button>
        <details id="overlapResultsDetails3D" class="overlap-details">
          <summary id="overlapResultsSummary3D">Overlap Results</summary>
          <ul id="overlapResults3D" class="overlap-results"></ul>
        </details>
      </div>

      <div class="panel-section">
        <h2>Bench Side</h2>
        <div class="button-row">
          <button id="benchSideLeft3D" class="full-width">Left</button>
          <button id="benchSideRight3D" class="full-width">Right</button>
        </div>
      </div>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/scene3d.js"></script>
</body>
</html>
