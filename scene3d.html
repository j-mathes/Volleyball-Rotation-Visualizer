<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Preview — Volleyball Rotation Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 16px 24px;
      background: rgba(27, 39, 51, 0.75);
      box-sizing: border-box;
    }
    #scene3d {
      position: fixed;
      inset: 0;
    }
    .floating-panel {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 15;
      width: 260px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      background: var(--panel-bg);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .floating-panel-handle {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: move;
      touch-action: none;
      user-select: none;
      padding: 10px 14px;
      font-weight: bold;
      color: var(--accent);
      background: #e4e9ef;
      border-radius: 8px 8px 0 0;
    }
    .floating-panel-collapse-btn {
      flex: 0 0 auto;
      background: transparent;
      color: var(--accent);
      padding: 4px 12px;
      font-size: 1.4rem;
      line-height: 1;
      transition: transform 0.15s ease;
    }
    .floating-panel-collapse-btn:hover {
      background: rgba(44, 62, 80, 0.15);
    }
    .floating-panel.collapsed .floating-panel-collapse-btn {
      transform: rotate(-90deg);
    }
    .floating-panel.collapsed .floating-panel-body {
      display: none;
    }
    .floating-panel-body {
      padding: 16px;
    }
    .view-cube-wrap {
      position: fixed;
      top: 90px;
      right: 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .view-cube-home {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      padding: 0;
      font-size: 1.1rem;
      line-height: 1;
      border-radius: 50%;
    }
    .view-cube-scene {
      position: relative;
      width: 100px;
      height: 100px;
      perspective: 500px;
    }
    .view-cube {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }
    .vc-face,
    .vc-edge,
    .vc-corner {
      position: absolute;
      left: 50%;
      top: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      backface-visibility: hidden;
      box-sizing: border-box;
    }
    .vc-face {
      width: 60px;
      height: 60px;
      margin: -30px 0 0 -30px;
      background: rgba(44, 62, 80, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      font-size: 0.6rem;
      font-weight: bold;
      letter-spacing: 0.03em;
    }
    .vc-face:hover {
      background: rgba(52, 152, 219, 0.85);
    }
    .vc-edge {
      width: 16px;
      height: 16px;
      margin: -8px 0 0 -8px;
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(27, 39, 51, 0.6);
    }
    .vc-corner {
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      background: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(27, 39, 51, 0.6);
    }
    .vc-edge:hover,
    .vc-corner:hover {
      background: rgba(52, 152, 219, 0.9);
    }
    .view-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 6px;
      background: var(--panel-bg);
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      min-width: 150px;
    }
    .view-menu button {
      display: block;
      width: 100%;
      border-radius: 0;
      text-align: left;
    }
    .view-menu[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-header">
    <h1>3D Preview <small style="font-weight: normal; opacity: 0.8;">(work in progress)</small></h1>
    <div class="header-links">
      <a href="index.html" class="setup-link">&larr; Back to Visualizer</a>
    </div>
  </div>
  <div id="scene3d"></div>
  <div id="viewCubeWrap" class="view-cube-wrap">
    <button type="button" id="viewCubeHome" class="view-cube-home" title="Reset to default view (Home / P)">&#8962;</button>
    <div class="view-cube-scene">
      <div id="viewCube3D" class="view-cube"></div>
      <div id="viewMenu3D" class="view-menu" hidden>
        <button type="button" data-view="0,1,0">Top</button>
        <button type="button" data-view="0,-1,0">Bottom</button>
        <button type="button" data-view="0,0,1">Front</button>
        <button type="button" data-view="0,0,-1">Back</button>
        <button type="button" data-view="-1,0,0">Left</button>
        <button type="button" data-view="1,0,0">Right</button>
        <button type="button" data-view="home">Home / Perspective</button>
      </div>
    </div>
  </div>
  <div id="controlPanel3D" class="floating-panel">
    <div class="floating-panel-handle">
      <span>&#10021; Controls (drag to move)</span>
      <button type="button" id="panelCollapseToggle3D" class="floating-panel-collapse-btn" title="Collapse/expand this panel">&#9662;</button>
    </div>
    <div class="floating-panel-body">
      <div class="panel-section">
        <div class="rotation-display">Serving: <span id="serverZone3D">S</span> (zone 1) &middot; <span id="rotationNumber3D">R1</span></div>
      </div>

      <div class="panel-section">
        <h2>Overlap Status</h2>
        <div class="button-row">
          <button id="overlapGuideToggle3D" class="full-width">Show Overlap Guides</button>
          <button id="playerLinkToggle3D" class="full-width">Show Player Links</button>
        </div>
        <button id="clampToggle3D" class="full-width" title="Constrain dragging so a player can't be moved past the fault line against its current row/column neighbors">Lock to Legal Positions</button>
        <details id="overlapResultsDetails3D" class="overlap-details">
          <summary id="overlapResultsSummary3D">Overlap Results</summary>
          <ul id="overlapResults3D" class="overlap-results"></ul>
        </details>
      </div>

      <div class="panel-section">
        <h2>Bench Side</h2>
        <div class="button-row">
          <button id="benchSideLeft3D" class="full-width">Left</button>
          <button id="benchSideRight3D" class="full-width">Right</button>
        </div>
      </div>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/scene3d.js"></script>
</body>
</html>
