<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Volleyball Rotation Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="app-header">
      <h1>Volleyball Rotation Visualizer</h1>
      <div class="header-links">
        <a href="setup.html" class="setup-link">Setup</a>
      </div>
    </div>

    <div class="layout">
      <svg id="court"></svg>
      <div id="scene3dMount" class="scene3d-mount" hidden>
        <div id="viewCubeWrap" class="view-cube-wrap">
          <button type="button" class="view-cube-home" title="Reset to default view (Home / P)">&#8962;</button>
          <div class="view-cube-scene">
            <div class="view-cube"></div>
            <div class="view-menu" hidden>
              <button type="button" data-view="0,1,0">Top</button>
              <button type="button" data-view="0,-1,0">Bottom</button>
              <button type="button" data-view="0,0,1">Endline</button>
              <button type="button" data-view="0,0,-1">Net</button>
              <button type="button" data-view="-1,0,0">Left</button>
              <button type="button" data-view="1,0,0">Right</button>
              <button type="button" data-view="home">Home / Perspective</button>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-section">
          <h2>View Mode</h2>
          <div class="button-row">
            <button id="viewMode2DBtn" class="full-width">2D View</button>
            <button id="viewMode3DBtn" class="full-width">3D View</button>
          </div>
        </div>

        <div class="panel-section" id="viewOrientationSection">
          <h2>View Orientation</h2>
          <div class="button-row">
            <button id="viewAngleLeft" class="full-width" title="Net on the left">Net Left</button>
            <button id="viewAngleTop" class="full-width" title="Net at the top (default)">Net Top</button>
            <button id="viewAngleRight" class="full-width" title="Net on the right">Net Right</button>
          </div>
        </div>

        <div class="panel-section" id="benchSide3DSection" hidden>
          <h2>Bench Side</h2>
          <p class="hint">Only applies in 3D View - the 2D view already
            places the bench automatically for each net orientation.</p>
          <div class="button-row">
            <button id="benchSide3DLeft" class="full-width">Left</button>
            <button id="benchSide3DRight" class="full-width">Right</button>
          </div>
        </div>

        <div class="panel-section">
          <div class="rotation-display">Serving: <span id="serverZone">S</span> (zone 1)</div>
          <div class="button-row">
            <button id="rotateCw" title="Rotate clockwise (standard side-out rotation)">Rotate &#8635;</button>
            <button id="rotateCcw" title="Rotate counter-clockwise (undo)">&#8634; Rotate Back</button>
          </div>
          <button id="resetBtn" class="full-width">Reset to Base Positions</button>
        </div>

        <div class="panel-section">
          <button id="liberoSwapBtn" class="full-width">Swap In Libero</button>
        </div>

        <div class="panel-section">
          <h2>Overlap Status</h2>
          <div class="button-row">
            <button id="overlapGuideToggle" class="full-width">Show Overlap Guides</button>
            <button id="playerLinkToggle" class="full-width">Show Player Links</button>
          </div>
          <button id="clampToggle" class="full-width" title="Prevents dragging a player past the fault line against its current row/column neighbors">Lock to Legal Positions</button>
          <details id="overlapResultsDetails" class="overlap-details">
            <summary id="overlapResultsSummary">Overlap Results</summary>
            <ul id="overlapResults" class="overlap-results"></ul>
          </details>
        </div>

        <div class="panel-section">
          <h2>Court Setups</h2>
          <input type="text" id="setupNameInput" class="text-input" placeholder="Setup name">
          <button id="saveSetupBtn" class="full-width">Save Current Setup</button>
          <input type="text" id="quickLoadInput" class="text-input" list="quickLoadOptions" placeholder="Quick load a saved setup…">
          <datalist id="quickLoadOptions"></datalist>
          <button id="quickLoadBtn" class="full-width">Load</button>
        </div>

        <div class="panel-section">
          <h2>Playlist Playback</h2>
          <div class="button-row">
            <button id="playlistPlayBtn" class="full-width">Play Playlist</button>
            <button id="playlistStepBtn" class="full-width">Step</button>
          </div>
          <p id="playlistStatus" class="hint"></p>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
