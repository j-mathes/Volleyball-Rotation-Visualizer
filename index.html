<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Volleyball Rotation Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="app-header">
      <h1>Volleyball Rotation Visualizer</h1>
      <a href="setup.html" class="setup-link">Setup</a>
    </div>

    <div class="layout">
      <svg id="court"></svg>

      <div class="panel">
        <div class="panel-section">
          <div class="rotation-display">Serving: <span id="serverZone">S</span> (zone 1)</div>
          <div class="button-row">
            <button id="rotateCw" title="Rotate clockwise (standard side-out rotation)">Rotate &#8635;</button>
            <button id="rotateCcw" title="Rotate counter-clockwise (undo)">&#8634; Rotate Back</button>
          </div>
          <button id="resetBtn" class="full-width">Reset to Base Positions</button>
        </div>

        <div class="panel-section">
          <button id="liberoSwapBtn" class="full-width">Swap In Libero</button>
          <p class="hint">Click, then click a highlighted back-row player to swap the Libero in for them.</p>
        </div>

        <div class="panel-section">
          <h2>Overlap Status</h2>
          <button id="overlapGuideToggle" class="full-width">Show Overlap Guides</button>
          <p class="hint">While on, click a player to see its overlap boundaries with neighboring players.</p>
          <ul id="overlapResults" class="overlap-results"></ul>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
