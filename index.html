<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volleyball Rotation Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position: absolute;" aria-hidden="true">
    <defs>
      <symbol id="puckIcon" viewBox="0 0 24 16">
        <ellipse cx="12" cy="11.5" rx="10" ry="3.5" fill="#555555" />
        <path d="M2 11.5 V7.5 A10 3.5 0 0 0 22 7.5 V11.5 A10 3.5 0 0 1 2 11.5 Z" fill="#787878" />
        <ellipse cx="12" cy="7.5" rx="10" ry="3.5" fill="#b0b0b0" />
      </symbol>
    </defs>
  </svg>
  <div class="app">
    <div class="app-header">
      <h1>Volleyball Rotation Visualizer</h1>
      <div class="header-links">
        <a href="reference.html" class="setup-link">Shortcuts</a>
        <a href="setup.html" class="setup-link">Setup</a>
      </div>
    </div>

    <div class="layout">
      <div class="top-bar">
        <span id="rotationBadge" class="rotation-badge">R1</span>
        <div class="top-bar-rows">
          <div class="top-bar-row op-row">
            <div class="op-group">
              <button id="viewMode2DBtn">2D View</button>
              <button id="viewMode3DBtn">3D View</button>
            </div>
            <div class="op-group">
              <button id="rotateCw" title="Rotate clockwise (standard side-out rotation)">Rotate &#8635;</button>
              <button id="rotateCcw" title="Rotate counter-clockwise (undo)">&#8634; Rotate Back</button>
              <button id="resetBtn">Reset to Base Positions</button>
            </div>
            <div class="op-group">
              <button id="liberoSwapBtn">Swap In Libero</button>
            </div>
            <div class="op-group toggle-indicators" id="toggleIndicators">
              <span id="indicatorGuides" class="toggle-indicator indicator-guides" hidden><span class="indicator-swatch"></span>Overlap Guides</span>
              <span id="indicatorLinks" class="toggle-indicator indicator-links" hidden><span class="indicator-swatch"></span>Player Links</span>
              <span id="indicatorClamp" class="toggle-indicator indicator-clamp" hidden><span class="indicator-swatch"></span>Lock to Legal</span>
              <span id="indicatorFrontRowLink" class="toggle-indicator indicator-row-link" hidden><span class="indicator-swatch"></span>Front Row Link</span>
              <span id="indicatorBackRowLink" class="toggle-indicator indicator-row-link indicator-dashed" hidden><span class="indicator-swatch"></span>Back Row Link</span>
            </div>
          </div>

          <div class="top-bar-row status-row">
            <div class="status-summary">
              <span class="rotation-display">Serving: <span id="serverZone">S</span> (zone 1)</span>
              <span id="overlapResultsSummary">Overlap Results</span>
            </div>
            <ul id="overlapResults" class="status-cards"></ul>
          </div>
        </div>
      </div>

      <div class="stage">
        <svg id="court"></svg>
        <div id="scene3dMount" class="scene3d-mount" hidden>
          <div id="viewCubeWrap" class="view-cube-wrap">
            <button type="button" class="view-cube-home" title="Reset to default view (Home / P)">&#8962;</button>
            <div class="view-cube-scene">
              <div class="view-cube"></div>
              <div class="view-menu" hidden>
                <button type="button" data-view="0,1,0">Top</button>
                <button type="button" data-view="0,0,1">Endline</button>
                <button type="button" data-view="0,0,-1">Net</button>
                <button type="button" data-view="-1,0,0">Left</button>
                <button type="button" data-view="1,0,0">Right</button>
                <button type="button" data-view="home">Home / Perspective</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button type="button" id="quadMenuBtn" class="quad-menu-btn" title="Open the menu (right-click on desktop)" aria-label="Open menu">&#9776;</button>

      <!-- Right-click (2D and 3D) opens this centered at the cursor - see
           js/quadMenu.js. Each quad-section expands outward from that
           point (3ds Max quad-menu style); anything marked
           `quad-3d-only` (whole sections or just a sub-group) is
           hidden/shown per view mode on open(). -->
      <div id="quadMenu" class="quad-menu" hidden>
        <button type="button" class="quad-close" aria-label="Close menu">&#10005;</button>
        <div class="quad-line quad-line-h"></div>
        <div class="quad-line quad-line-v"></div>

        <div class="quad-section quad-tl" id="quadViewCamera">
          <div class="quad-title">View</div>
          <div class="quad-items">
            <div class="quad-group">
              <button id="qmOverlapGuideToggle" title="Select a player to preview the boundary lines it must stay within">Overlap Guides (G)</button>
              <button id="qmPlayerLinkToggle" title="Select a player to draw lines to the players it is compared against">Player Links (J)</button>
              <button id="qmClampToggle" title="Stop dragging a player past a positional-fault line">Lock to Legal (C)</button>
              <button id="qmFrontRowLinkToggle" title="Draw a solid line connecting the front-row players">Front Row Link (F)</button>
              <button id="qmBackRowLinkToggle" title="Draw a dashed line connecting the back-row players">Back Row Link (B)</button>
              <button id="qmZoneLabelToggle" title="Show each player's current zone under its label">Zone Labels (K)</button>
            </div>
            <div class="quad-group">
              <button id="qmPlayerIconPuck" data-player-icon="puck" title="Players shown as pucks">Puck <svg class="puck-icon"><use href="#puckIcon" /></svg></button>
              <button id="qmPlayerIconMannequin" data-player-icon="mannequin" title="3D: standing mannequins. 2D: footprints">Mannequin &#x1F9CD;</button>
            </div>
            <div class="quad-group">
              <button id="qmPuckSizeSmall" data-puck-size="small" title="Small pucks / 5'2&quot; mannequins">Small <svg class="puck-icon"><use href="#puckIcon" /></svg></button>
              <button id="qmPuckSizeMedium" data-puck-size="medium" title="Medium pucks / 5'9&quot; mannequins">Medium <svg class="puck-icon"><use href="#puckIcon" /></svg></button>
              <button id="qmPuckSizeLarge" data-puck-size="large" title="Large pucks / 6'2&quot; mannequins">Large <svg class="puck-icon"><use href="#puckIcon" /></svg></button>
            </div>
            <div class="quad-group quad-3d-only">
              <button id="qmResetView" title="Return the camera to the default view">&#8962; Reset</button>
              <button id="qmZoomExtents" title="Frame the whole court, or the last Alt+clicked player">&#10530; Extents</button>
            </div>
            <div class="quad-group quad-3d-only">
              <button id="qmViewCubeSmall" data-size="small" title="Small view cube">Small &#x1F9CA;</button>
              <button id="qmViewCubeMedium" data-size="medium" title="Medium view cube">Medium &#x1F9CA;</button>
              <button id="qmViewCubeLarge" data-size="large" title="Large view cube">Large &#x1F9CA;</button>
            </div>
            <div class="quad-group quad-3d-only">
              <button id="qmLabelScaleOn" data-mode="scale" title="Labels shrink and grow with distance, like the players">Scale &#x2131;</button>
              <button id="qmLabelScaleOff" data-mode="fixed" title="Labels stay the same size on screen">Fixed &#x2131;</button>
            </div>
            <div class="quad-group quad-3d-only">
              <button id="qmInvertPitchToggle" title="Flip up/down mouse-look when viewing from R1/R2">Invert Pitch (R1/R2)</button>
            </div>
          </div>
        </div>

        <div class="quad-section quad-tr" id="quadSceneSetup">
          <div class="quad-title">Scene</div>
          <div class="quad-items">
            <div class="quad-group">
              <button id="qmRotateCw" title="Rotate clockwise (standard side-out rotation)">Rotate CW ( ] )</button>
              <button id="qmRotateCcw" title="Rotate counter-clockwise (undo)">Rotate CCW ( [ )</button>
            </div>
            <div class="quad-group">
              <button id="qmResetToBase" title="Return every player to their base position">Reset to Base (0)</button>
            </div>
            <div class="quad-group">
              <button id="qmSwapLibero" title="Swap the Libero in or out">Swap Libero (/)</button>
            </div>
            <div class="quad-group quad-3d-only">
              <button id="benchSide3DLeft" title="Put the bench on the left side">&#8592; Bench Left</button>
              <button id="benchSide3DRight" title="Put the bench on the right side">Bench Right &#8594;</button>
            </div>
          </div>
        </div>

        <div class="quad-section quad-bl" id="quadCourtSetups">
          <div class="quad-title">Setups</div>
          <div class="quad-items">
            <div class="quad-group">
              <input type="text" id="setupNameInput" class="text-input" placeholder="Name" title="Name for the setup to save">
              <button id="saveSetupBtn" title="Save the current arrangement under this name">&#128190; Save</button>
              <input type="text" id="quickLoadInput" class="text-input" list="quickLoadOptions" placeholder="Load&hellip;" title="Name of a saved setup to load">
              <datalist id="quickLoadOptions"></datalist>
              <button id="quickLoadBtn" title="Load the saved setup with this name">&#128194; Load</button>
            </div>
            <div class="quad-group">
              <button id="playlistPlayBtn">&#9654; Play</button>
              <button id="playlistStepBtn" title="Step to the next setup in the playlist (Right arrow)">&#9197; Step</button>
              <p id="playlistStatus" class="hint"></p>
            </div>
          </div>
        </div>

        <div class="quad-section quad-br" id="quadShortcuts">
          <div class="quad-title">Keys</div>
          <div class="quad-items">
            <div id="quadShortcutsList" class="quad-group"></div>
            <a href="reference.html">&#128214; Full Reference</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
