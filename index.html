<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Volleyball Rotation Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="app-header">
      <h1>Volleyball Rotation Visualizer</h1>
      <div class="header-links">
        <a href="reference.html" class="setup-link">Shortcuts</a>
        <a href="setup.html" class="setup-link">Setup</a>
      </div>
    </div>

    <div class="layout">
      <div class="top-bar">
        <div class="top-bar-row op-row">
          <div class="op-group">
            <button id="viewMode2DBtn">2D View</button>
            <button id="viewMode3DBtn">3D View</button>
          </div>
          <div class="op-group">
            <button id="rotateCw" title="Rotate clockwise (standard side-out rotation)">Rotate &#8635;</button>
            <button id="rotateCcw" title="Rotate counter-clockwise (undo)">&#8634; Rotate Back</button>
            <button id="resetBtn">Reset to Base Positions</button>
          </div>
          <div class="op-group">
            <button id="liberoSwapBtn">Swap In Libero</button>
          </div>
          <div class="op-group">
            <button id="overlapGuideToggle">Show Overlap Guides</button>
            <button id="playerLinkToggle">Show Player Links</button>
            <button id="clampToggle" title="Prevents dragging a player past the fault line against its current row/column neighbors">Lock to Legal Positions</button>
          </div>
        </div>

        <div class="top-bar-row status-row">
          <div class="status-summary">
            <span class="rotation-display">Serving: <span id="serverZone">S</span> (zone 1)</span>
            <span id="overlapResultsSummary">Overlap Results</span>
          </div>
          <ul id="overlapResults" class="status-cards"></ul>
        </div>
      </div>

      <div class="stage">
        <svg id="court"></svg>
        <div id="scene3dMount" class="scene3d-mount" hidden>
          <div id="viewCubeWrap" class="view-cube-wrap">
            <button type="button" class="view-cube-home" title="Reset to default view (Home / P)">&#8962;</button>
            <div class="view-cube-scene">
              <div class="view-cube"></div>
              <div class="view-menu" hidden>
                <button type="button" data-view="0,1,0">Top</button>
                <button type="button" data-view="0,-1,0">Bottom</button>
                <button type="button" data-view="0,0,1">Endline</button>
                <button type="button" data-view="0,0,-1">Net</button>
                <button type="button" data-view="-1,0,0">Left</button>
                <button type="button" data-view="1,0,0">Right</button>
                <button type="button" data-view="home">Home / Perspective</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right-click (2D and 3D) opens this at the cursor - see
           js/quadMenu.js. Sections hidden/shown per view mode on open(). -->
      <div id="quadMenu" class="quad-menu" hidden>
        <div class="quad-section" id="quadViewCamera">
          <h3>View &amp; Camera</h3>
          <div class="button-row">
            <button id="qmResetView" class="full-width">Reset View</button>
            <button id="qmZoomExtents" class="full-width">Zoom Extents</button>
          </div>
          <div class="button-row quad-view-presets">
            <button data-view="0,1,0">Top</button>
            <button data-view="0,-1,0">Bottom</button>
            <button data-view="0,0,1">Endline</button>
            <button data-view="0,0,-1">Net</button>
            <button data-view="-1,0,0">Left</button>
            <button data-view="1,0,0">Right</button>
          </div>
          <p class="hint">ViewCube Size</p>
          <div class="button-row">
            <button id="qmViewCubeSmall" data-size="small" class="full-width">Small</button>
            <button id="qmViewCubeMedium" data-size="medium" class="full-width">Medium</button>
            <button id="qmViewCubeLarge" data-size="large" class="full-width">Large</button>
          </div>
          <p class="hint">Player Label Scaling</p>
          <div class="button-row">
            <button id="qmLabelScaleOn" data-mode="scale" class="full-width">Scale with Distance</button>
            <button id="qmLabelScaleOff" data-mode="fixed" class="full-width">Fixed Size</button>
          </div>
        </div>

        <div class="quad-section" id="quadSceneSetup">
          <h3>Scene Setup</h3>
          <p class="hint">Bench Side</p>
          <div class="button-row">
            <button id="benchSide3DLeft" class="full-width">Left</button>
            <button id="benchSide3DRight" class="full-width">Right</button>
          </div>
        </div>

        <div class="quad-section" id="quadCourtSetups">
          <h3>Court Setups &amp; Playlist</h3>
          <input type="text" id="setupNameInput" class="text-input" placeholder="Setup name">
          <button id="saveSetupBtn" class="full-width">Save Current Setup</button>
          <input type="text" id="quickLoadInput" class="text-input" list="quickLoadOptions" placeholder="Quick load a saved setup…">
          <datalist id="quickLoadOptions"></datalist>
          <button id="quickLoadBtn" class="full-width">Load</button>
          <div class="button-row">
            <button id="playlistPlayBtn" class="full-width">Play Playlist</button>
            <button id="playlistStepBtn" class="full-width">Step</button>
          </div>
          <p id="playlistStatus" class="hint"></p>
        </div>

        <div class="quad-section" id="quadShortcuts">
          <h3>Keyboard &amp; Mouse</h3>
          <ul id="quadShortcutsList" class="shortcuts-list"></ul>
          <a href="reference.html" target="_blank">Full reference page</a>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
